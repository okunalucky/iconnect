<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Iconnect Stores</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
}

/* HEADER */
header {
    background: #111;
    color: white;
    padding: 15px 30px;
}

header h2 {
    margin: 0;
}

/* CENTER LOGIN */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90vh;
}

/* LOGIN BOX */
.login-box {
    background: white;
    padding: 40px;
    width: 320px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.login-box h2 {
    margin-bottom: 20px;
    text-align: center;
}

/* INPUTS */
.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    background: #e91e63;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #c2185b;
}

/* LINKS */
.login-box p {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.login-box a {
    color: #e91e63;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
    <h2>My Connect</h2>
</header>

<section class="login-container">
    <div class="login-box">

        <h2>Login</h2>

        <form>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>

            <p>Don't have an account? <a href="#">Register</a></p>
        </form>

    </div>
</section>

</body>
</html>
